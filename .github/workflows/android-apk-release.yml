name: Android APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk-release.yml'
      - 'gradlew'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Rename APK asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/anvil-tracker-app-debug.apk

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest Android APK
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/anvil-tracker-app-debug.apk
